model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
plan_mode_reasoning_effort = "xhigh"
default_permissions = ":read-only"

[notice]
fast_default_opt_out = true

[features]
daemon_auto_start = false

[tui]
whimsy = false
status_line = [
  "model-with-reasoning",
  "current-dir",
  "model",
  "reasoning",
  "project-name",
  "git-branch",
  "pull-request-number",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
]
status_line_use_colors = true
screen_reader_detection_done = true

[windows]
sandbox = "elevated"

[permissions.windows-msys2-read]
extends = ":read-only"

[permissions.windows-msys2-read.filesystem]
'C:\msys64\usr\bin' = "read"
'C:\Users\kvnxiao\.cargo\bin' = "read"
'C:\Program Files\Git\cmd' = "read"
'C:\Users\kvnxiao\.pnpm\bin' = "read"
